[project]
name = "mbsd"
version = "0.5.0"
description = "Readable Python tools for planar multibody mechanism kinematics and dynamics."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
]
license = { file = "LICENSE" }
authors = [
    { name = "Julius Alcocer" },
]
keywords = [
    "multibody dynamics",
    "mechanisms",
    "kinematics",
    "dynamics",
    "linkages",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8,<4.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[project.urls]
Homepage = "https://multibodysystemsdynamics.com"
Repository = "https://github.com/JAlcocerT/mbsd-core"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
